<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ERPNext Item Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        #search-container {
            text-align: center;
            margin-bottom: 20px;
        }
        #search_input {
            width: 60%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
        }
        #results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .item-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            margin: 8px;
            width: 220px;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .item-card img {
            max-width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .item-card strong {
            display: block;
            margin-bottom: 5px;
        }
        .item-price {
            color: green;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-uom {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

<h2>ERPNext Item Search</h2>

<div id="search-container">
    <input type="text" id="search_input" placeholder="Enter item name...">
    <button onclick="searchItem()">Search</button>
</div>

<div id="results"></div>

<script>
async function searchItem() {
    const query = document.getElementById("search_input").value.trim();
    const container = document.getElementById("results");
    container.innerHTML = "";

    if (!query) {
        alert("Please enter an item name to search");
        return;
    }

    container.innerHTML = "<p>Loading...</p>";

    try {
        const response = await fetch(`http://161.97.81.51:5000/search_item?name=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!data.data || data.data.length === 0) {
            container.innerHTML = "<p>No items found</p>";
            return;
        }

        let html = "";
        data.data.forEach(item => {
            html += `
                <div class="item-card">
                    ${item.image ? `<img src="${item.image}" alt="${item.item_name}">` : ''}
                    <strong>${item.item_name}</strong>
                    <div>Code: ${item.item_code}</div>
                    <div class="item-price">Price: ${item.price}</div>
                    <div class="item-uom">UOM: ${item.uom}</div>
                </div>
            `;
        });

        container.innerHTML = html;

    } catch (err) {
        console.error(err);
        container.innerHTML = "<p>Error fetching items. Please try again later.</p>";
    }
}
</script>

</body>
</html>

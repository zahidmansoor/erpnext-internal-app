<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Item Price Lookup</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
input { padding: 8px 12px; width: 300px; font-size: 16px; }
button { padding: 8px 16px; font-size: 16px; }
.items-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
.item-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-shadow: 1px 1px 5px rgba(0,0,0,0.05); text-align: center; }
.item-image { width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px; }
.item-name { font-weight: bold; margin-bottom: 8px; }
.item-price { font-size: 1.2em; color: #007bff; }
</style>
</head>
<body>

<h2>Item Price Lookup</h2>
<input type="text" id="item_name" placeholder="Enter item name or code...">
<button id="search-btn">Search</button>

<div id="item-details"></div>

<script>
const API_URL = "http://161.97.81.51:5000/search_item"; // Your Flask API

document.getElementById("search-btn").addEventListener("click", searchItems);
document.getElementById("item_name").addEventListener("keypress", e => {
    if (e.key === "Enter") searchItems();
});

async function searchItems() {
    const query = document.getElementById("item_name").value.trim();
    const div = document.getElementById("item-details");
    if (!query) return alert("Enter item name or code");

    div.innerHTML = "<p>Searching...</p>";

    try {
        const res = await fetch(`${API_URL}?name=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data.data || data.data.length === 0) {
            div.innerHTML = "<p style='color:red'>No items found</p>";
            return;
        }

        let html = '<div class="items-container">';
        data.data.forEach(item => {
            const img = item.image || "https://via.placeholder.com/150";
            html += `
                <div class="item-card">
                    <img src="${img}" class="item-image" alt="${item.item_name}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="item-name">${item.item_name}</div>
                    <div class="item-price">Rs ${item.price}</div>
                    <div>Code: ${item.item_code}</div>
                </div>`;
        });
        html += "</div>";
        div.innerHTML = html;
    } catch (err) {
        console.error(err);
        div.innerHTML = "<p style='color:red'>Error fetching data</p>";
    }
}
</script>

</body>
</html>
